<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일당 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #5b6ef5;
      --primary-light: #eef0ff;
      --primary-dark: #4a5ce0;
      --green: #22c55e;
      --green-light: #f0fdf4;
      --red: #ef4444;
      --red-light: #fef2f2;
      --yellow: #f59e0b;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1e2130;
      --text-sub: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-tap-highlight-color: transparent;
    }

    /* ── 헤더 ── */
    header {
      background: linear-gradient(135deg, var(--primary), #9b72f5);
      color: white; padding: 24px 20px 20px; text-align: center;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    .header-sub {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 6px; font-size: 0.82rem; opacity: 0.85;
    }
    .today-badge {
      background: rgba(255,255,255,0.2); border-radius: 20px;
      padding: 2px 10px; font-size: 0.78rem;
    }

    /* ── 레이아웃 ── */
    .container { max-width: 680px; margin: 0 auto; padding: 16px 14px 40px; }
    .card {
      background: var(--card); border-radius: var(--radius);
      padding: 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 0.8rem; font-weight: 600; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }

    /* ── 현장 관리 ── */
    .site-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .site-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--bg);
      border-radius: 12px; border: 1.5px solid var(--border);
    }
    .site-dot {
      width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    }
    .site-info { flex: 1; min-width: 0; }
    .site-name { font-size: 0.95rem; font-weight: 700; }
    .site-wage { font-size: 0.78rem; color: var(--text-sub); margin-top: 1px; }
    .site-actions { display: flex; gap: 6px; }
    .btn-site-edit {
      padding: 4px 10px; border-radius: 8px; font-size: 0.75rem;
      border: 1.5px solid var(--border); background: white;
      color: var(--text-sub); cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .btn-site-edit:hover { border-color: var(--primary); color: var(--primary); }
    .btn-site-del {
      padding: 4px 10px; border-radius: 8px; font-size: 0.75rem;
      border: 1.5px solid #fca5a5; background: var(--red-light);
      color: var(--red); cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .btn-site-del:hover { background: #fee2e2; }

    .btn-add-site {
      width: 100%; padding: 10px; border-radius: 12px;
      border: 2px dashed var(--border); background: transparent;
      color: var(--text-sub); font-size: 0.9rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .btn-add-site:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    .empty-site { text-align: center; padding: 16px 0; color: var(--text-sub); font-size: 0.88rem; }

    /* ── 월 네비게이션 ── */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    }
    .nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary-light); border: none;
      color: var(--primary); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; font-weight: 700;
    }
    .nav-btn:hover { background: var(--primary); color: white; }
    .month-title { font-size: 1.15rem; font-weight: 700; color: var(--text); }

    /* ── 캘린더 ── */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-header {
      text-align: center; font-size: 0.72rem; font-weight: 600;
      padding: 4px 0 8px; color: var(--text-sub);
    }
    .day-header:first-child { color: var(--red); }
    .day-header:last-child  { color: var(--primary); }

    .day-cell {
      border-radius: 10px; padding: 5px 3px 4px;
      text-align: center; cursor: pointer;
      transition: all 0.15s; min-height: 72px;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      border: 1.5px solid transparent; background: var(--bg);
      position: relative; overflow: hidden;
    }
    .day-cell:active:not(.empty) { transform: scale(0.95); }
    .day-cell:hover:not(.empty)  { border-color: var(--primary); background: var(--primary-light); }
    .day-cell.empty { background: transparent; cursor: default; }
    .day-cell.today { border-color: var(--primary); background: var(--primary-light); }
    .day-cell.today .day-num {
      background: var(--primary); color: white;
      border-radius: 50%; width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .day-cell.worked { background: #f8f9ff; }

    /* 현장 색상 스트립 */
    .day-site-strip {
      position: absolute; top: 0; left: 0; right: 0;
      height: 4px; border-radius: 10px 10px 0 0;
    }

    .day-num {
      font-size: 0.82rem; font-weight: 600; color: var(--text);
      min-width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      margin-top: 3px;
    }
    .day-cell.sunday .day-num   { color: var(--red); }
    .day-cell.saturday .day-num { color: var(--primary); }
    .day-cell.today.sunday .day-num,
    .day-cell.today.saturday .day-num { color: white; }

    .day-holiday { font-size: 0.5rem; color: var(--red); line-height: 1.2; text-align: center; max-width: 100%; overflow: hidden; }
    .attend-emoji { font-size: 1.1rem; line-height: 1; }
    .day-site-label { font-size: 0.55rem; font-weight: 700; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
    .day-wage    { font-size: 0.6rem; font-weight: 700; color: var(--primary); line-height: 1; }
    .day-expense { font-size: 0.52rem; color: var(--text-sub); line-height: 1.3; }

    /* ── 요약 ── */
    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .summary-item { border-radius: 12px; padding: 14px 12px; text-align: center; }
    .summary-item .s-icon  { font-size: 1.3rem; margin-bottom: 4px; }
    .summary-item .s-label { font-size: 0.72rem; color: var(--text-sub); margin-bottom: 4px; font-weight: 500; }
    .summary-item .s-value { font-size: 1.1rem; font-weight: 700; }
    .s-days   { background: #f0f4ff; } .s-days .s-value   { color: var(--primary); }
    .s-income { background: #f0fdf4; } .s-income .s-value { color: var(--green); }
    .s-meal   { background: #fff7ed; } .s-meal .s-value   { color: #ea580c; }
    .s-trans  { background: #fdf4ff; } .s-trans .s-value  { color: #9333ea; }
    .s-net {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--primary), #9b72f5);
      color: white; border-radius: 14px; padding: 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .s-net .s-label { color: rgba(255,255,255,0.8); font-size: 0.82rem; font-weight: 500; }
    .s-net .s-value { color: white; font-size: 1.5rem; font-weight: 700; }

    /* 현장별 요약 */
    .site-summary-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .site-summary-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; background: var(--bg);
      border-left: 4px solid var(--border);
    }
    .site-summary-info { flex: 1; }
    .site-summary-name { font-size: 0.88rem; font-weight: 700; }
    .site-summary-detail { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
    .site-summary-amount { font-size: 0.95rem; font-weight: 700; }

    /* 요약 헤더 */
    .summary-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .reset-btns { display: flex; gap: 6px; }
    .btn-reset {
      padding: 5px 12px; border-radius: 8px; font-size: 0.75rem;
      cursor: pointer; border: 1.5px solid var(--border);
      background: white; color: var(--text-sub);
      transition: all 0.15s; font-family: inherit; font-weight: 500;
    }
    .btn-reset:hover { border-color: var(--red); color: var(--red); }
    .btn-reset.danger { border-color: #fca5a5; color: var(--red); background: var(--red-light); }
    .btn-reset.danger:hover { background: #fee2e2; }

    /* ── 연간 통계 ── */
    .year-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .year-total-item { border-radius: 12px; padding: 14px; text-align: center; }
    .yt-days { background: #f0f4ff; }
    .yt-net  { background: linear-gradient(135deg, var(--primary), #9b72f5); }
    .yt-label { font-size: 0.72rem; font-weight: 500; margin-bottom: 4px; }
    .yt-days .yt-label { color: var(--text-sub); }
    .yt-net  .yt-label { color: rgba(255,255,255,0.8); }
    .yt-value { font-size: 1.15rem; font-weight: 700; }
    .yt-days .yt-value { color: var(--primary); }
    .yt-net  .yt-value { color: white; }

    .month-bars { display: flex; flex-direction: column; gap: 8px; }
    .month-row {
      display: grid; grid-template-columns: 36px 1fr 80px;
      align-items: center; gap: 8px;
    }
    .month-row.current-month .month-label { color: var(--primary); font-weight: 700; }
    .month-label { font-size: 0.8rem; color: var(--text-sub); font-weight: 500; text-align: right; }
    .bar-track { background: var(--bg); border-radius: 6px; height: 20px; overflow: hidden; }
    .bar-fill {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, var(--primary), #9b72f5);
      transition: width 0.5s ease; min-width: 0;
    }
    .bar-fill.empty { background: var(--border); }
    .month-amount { font-size: 0.78rem; font-weight: 600; color: var(--text); text-align: right; white-space: nowrap; }
    .month-amount.zero { color: var(--text-sub); font-weight: 400; }

    /* ── 백업/복원 ── */
    .io-row { display: flex; gap: 10px; }
    .btn-io {
      flex: 1; padding: 11px; border-radius: 10px; font-size: 0.9rem;
      cursor: pointer; border: none; font-weight: 600;
      transition: all 0.15s; font-family: inherit; text-align: center;
    }
    .btn-io.export { background: var(--primary-light); color: var(--primary); }
    .btn-io.export:hover { background: var(--primary); color: white; }
    .btn-io.import { background: var(--green-light); color: var(--green); }
    .btn-io.import:hover { background: var(--green); color: white; }
    .import-msg { font-size: 0.8rem; color: var(--green); margin-top: 8px; display: none; font-weight: 500; }

    /* ── 모달 (바텀시트) ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 200;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 24px 24px 0 0;
      padding: 12px 20px 32px;
      width: 100%; max-width: 680px;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.15);
      animation: slideUp 0.25s ease;
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 16px;
    }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 16px; text-align: center; }

    /* 현장 선택 (모달) */
    .site-picker-label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-bottom: 8px; }
    .site-picker {
      display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .site-pick-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 20px;
      border: 2px solid var(--border); background: var(--bg);
      cursor: pointer; font-size: 0.88rem; font-weight: 600;
      font-family: inherit; color: var(--text); transition: all 0.15s;
    }
    .site-pick-btn .sp-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .site-pick-btn.selected { font-weight: 700; color: white; }
    .no-site-msg { font-size: 0.85rem; color: var(--text-sub); padding: 8px 0; }

    .modal-wage-preview {
      background: var(--primary-light); border-radius: 10px;
      padding: 10px 14px; font-size: 0.9rem; font-weight: 700;
      color: var(--primary); margin-bottom: 14px; text-align: center; display: none;
    }

    .emoji-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 18px;
    }
    .emoji-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: var(--bg); border: 2px solid var(--border);
      border-radius: 12px; padding: 10px 6px; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .emoji-btn .e-icon  { font-size: 1.6rem; line-height: 1; }
    .emoji-btn .e-label { font-size: 0.65rem; color: var(--text-sub); font-weight: 500; }
    .emoji-btn:hover { border-color: var(--primary); background: var(--primary-light); }
    .emoji-btn.selected { border-color: var(--primary); background: var(--primary-light); }
    .emoji-btn.selected .e-label { color: var(--primary); }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-bottom: 5px; }
    .input-group input {
      width: 100%; border: 2px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 0.95rem; font-family: inherit;
      outline: none; transition: border-color 0.2s; color: var(--text);
    }
    .input-group input:focus { border-color: var(--primary); }

    .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
    .btn-cancel {
      flex: 1; padding: 12px; border: 2px solid var(--border);
      border-radius: 12px; background: white; cursor: pointer;
      font-size: 0.9rem; color: var(--text-sub); font-family: inherit;
      font-weight: 500; transition: all 0.15s;
    }
    .btn-cancel:hover { border-color: #aaa; }
    .btn-delete {
      flex: 1; padding: 12px; border: 2px solid #fca5a5;
      border-radius: 12px; background: var(--red-light); cursor: pointer;
      font-size: 0.9rem; color: var(--red); font-family: inherit;
      font-weight: 500; transition: all 0.15s;
    }
    .btn-delete:hover { background: #fee2e2; }
    .btn-save {
      flex: 2; padding: 12px; border: none;
      border-radius: 12px; background: var(--primary); color: white;
      cursor: pointer; font-size: 0.95rem; font-family: inherit;
      font-weight: 700; transition: all 0.15s;
    }
    .btn-save:hover { background: var(--primary-dark); }

    /* ── 현장 추가/수정 모달 ── */
    .site-modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 300;
      align-items: center; justify-content: center; padding: 20px;
    }
    .site-modal-overlay.open { display: flex; }
    .site-modal {
      background: white; border-radius: 20px; padding: 24px;
      width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .site-modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
    .site-modal .input-group input { font-size: 1rem; padding: 12px; }
    .color-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .color-dot {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: all 0.15s;
    }
    .color-dot.selected { border-color: var(--text); transform: scale(1.15); }

    @media (max-width: 400px) {
      .day-cell { min-height: 62px; }
      .attend-emoji { font-size: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>💰 일당 계산기</h1>
  <div class="header-sub">
    <span id="headerToday" class="today-badge"></span>
  </div>
</header>

<div class="container">

  <!-- 현장 관리 -->
  <div class="card">
    <div class="card-title">🏗️ 현장 관리</div>
    <div class="site-list" id="siteList"></div>
    <button class="btn-add-site" id="btnAddSite">+ 현장 추가</button>
  </div>

  <!-- 캘린더 -->
  <div class="card">
    <div class="month-nav">
      <button class="nav-btn" id="prevMonth">&#8592;</button>
      <span class="month-title" id="monthTitle"></span>
      <button class="nav-btn" id="nextMonth">&#8594;</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- 월별 요약 -->
  <div class="card">
    <div class="summary-header">
      <div class="card-title" style="margin:0;">📊 이번 달 요약</div>
      <div class="reset-btns">
        <button id="btnResetMonth" class="btn-reset">🗑️ 이번 달 초기화</button>
      </div>
    </div>
    <div class="summary-grid">
      <div class="summary-item s-days">
        <div class="s-icon">📅</div>
        <div class="s-label">출근 일수</div>
        <div class="s-value" id="sumDays">0일</div>
      </div>
      <div class="summary-item s-income">
        <div class="s-icon">💵</div>
        <div class="s-label">일당 합계</div>
        <div class="s-value" id="sumIncome">0원</div>
      </div>
      <div class="summary-item s-meal">
        <div class="s-icon">🍚</div>
        <div class="s-label">밥값 청구</div>
        <div class="s-value" id="sumMeal">0원</div>
      </div>
      <div class="summary-item s-trans">
        <div class="s-icon">🚌</div>
        <div class="s-label">차비 청구</div>
        <div class="s-value" id="sumTransport">0원</div>
      </div>
      <div class="summary-item s-net">
        <div>
          <div class="s-label">총 수령액</div>
          <div class="s-value" id="sumNet">0원</div>
        </div>
        <div style="font-size:2rem;">💰</div>
      </div>
    </div>
    <!-- 현장별 요약 -->
    <div class="site-summary-list" id="siteSummaryList"></div>
  </div>

  <!-- 연간 통계 -->
  <div class="card">
    <div class="card-title">📈 <span id="yearTitle"></span> 연간 통계</div>
    <div class="year-totals">
      <div class="year-total-item yt-days">
        <div class="yt-label">총 출근일</div>
        <div class="yt-value" id="yearDays">0일</div>
      </div>
      <div class="year-total-item yt-net">
        <div class="yt-label">총 수령액</div>
        <div class="yt-value" id="yearNet">0원</div>
      </div>
    </div>
    <div class="month-bars" id="monthBars"></div>
  </div>

  <!-- 백업/복원 -->
  <div class="card">
    <div class="card-title">💾 백업 / 복원</div>
    <div class="io-row">
      <button id="btnExport" class="btn-io export">📤 내보내기</button>
      <label class="btn-io import" for="fileImport">📥 가져오기</label>
      <input type="file" id="fileImport" accept=".json" style="display:none;" />
    </div>
    <p id="importMsg" class="import-msg"></p>
  </div>

</div>

<!-- 날짜 기록 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">날짜 기록</div>

    <div class="site-picker-label">🏗️ 현장 선택</div>
    <div class="site-picker" id="sitePicker"></div>
    <div class="modal-wage-preview" id="modalWagePreview"></div>

    <div class="emoji-grid">
      <button class="emoji-btn" data-emoji="✅"><span class="e-icon">✅</span><span class="e-label">출근</span></button>
      <button class="emoji-btn" data-emoji="⭐"><span class="e-icon">⭐</span><span class="e-label">특근</span></button>
      <button class="emoji-btn" data-emoji="🏖️"><span class="e-icon">🏖️</span><span class="e-label">휴일</span></button>
      <button class="emoji-btn" data-emoji="🤒"><span class="e-icon">🤒</span><span class="e-label">병결</span></button>
      <button class="emoji-btn" data-emoji="❌"><span class="e-icon">❌</span><span class="e-label">결근</span></button>
    </div>

    <div class="input-group">
      <label>🍚 밥값 청구 (원)</label>
      <input type="number" id="modalMeal" placeholder="오늘 밥값 청구액" min="0" step="500" />
    </div>
    <div class="input-group">
      <label>🚌 차비 청구 (원)</label>
      <input type="number" id="modalTransport" placeholder="오늘 차비 청구액" min="0" step="500" />
    </div>

    <div class="modal-btns">
      <button class="btn-cancel" id="btnCancel">취소</button>
      <button class="btn-delete" id="btnClear">삭제</button>
      <button class="btn-save"   id="btnSave">저장</button>
    </div>
  </div>
</div>

<!-- 현장 추가/수정 모달 -->
<div class="site-modal-overlay" id="siteModalOverlay">
  <div class="site-modal">
    <h3 id="siteModalTitle">현장 추가</h3>
    <div class="input-group">
      <label>현장 이름</label>
      <input type="text" id="siteNameInput" placeholder="예: 강남 현장" maxlength="10" />
    </div>
    <div class="input-group">
      <label>일당 (원)</label>
      <input type="number" id="siteWageInput" placeholder="예: 150000" min="0" step="1000" />
    </div>
    <div class="input-group">
      <label>색상</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="btnSiteCancel">취소</button>
      <button class="btn-save"   id="btnSiteSave">저장</button>
    </div>
  </div>
</div>

<script>
  const SITE_COLORS = ['#5b6ef5','#22c55e','#f59e0b','#ef4444','#9333ea','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6'];
  const WORK_EMOJIS = new Set(['✅','⭐']);

  let currentYear  = new Date().getFullYear();
  let currentMonth = new Date().getMonth();
  let selectedDate  = null;
  let selectedEmoji = null;
  let selectedSiteId = null;
  let editingSiteId  = null;
  let pickedColor    = SITE_COLORS[0];

  document.getElementById('headerToday').textContent =
    new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });

  // ── 현장 CRUD ─────────────────────────────
  function getSites() {
    const s = localStorage.getItem('sites');
    return s ? JSON.parse(s) : [];
  }
  function saveSites(arr) { localStorage.setItem('sites', JSON.stringify(arr)); }
  function getSiteById(id) { return getSites().find(s => s.id === id) || null; }

  function renderSiteList() {
    const sites = getSites();
    const container = document.getElementById('siteList');
    if (!sites.length) {
      container.innerHTML = '<div class="empty-site">현장을 추가하면 날짜별로 구분해서 기록할 수 있어요</div>';
      return;
    }
    container.innerHTML = '';
    sites.forEach(site => {
      const el = document.createElement('div');
      el.className = 'site-item';
      el.innerHTML = `
        <div class="site-dot" style="background:${site.color}"></div>
        <div class="site-info">
          <div class="site-name">${site.name}</div>
          <div class="site-wage">일당 ${site.wage.toLocaleString()}원</div>
        </div>
        <div class="site-actions">
          <button class="btn-site-edit" data-id="${site.id}">수정</button>
          <button class="btn-site-del"  data-id="${site.id}">삭제</button>
        </div>`;
      container.appendChild(el);
    });
    container.querySelectorAll('.btn-site-edit').forEach(btn => {
      btn.addEventListener('click', () => openSiteModal(btn.dataset.id));
    });
    container.querySelectorAll('.btn-site-del').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('이 현장을 삭제할까요?')) return;
        const sites = getSites().filter(s => s.id !== btn.dataset.id);
        saveSites(sites);
        renderSiteList(); renderCalendar();
      });
    });
  }

  // ── 현장 모달 ─────────────────────────────
  function openSiteModal(siteId = null) {
    editingSiteId = siteId;
    document.getElementById('siteModalTitle').textContent = siteId ? '현장 수정' : '현장 추가';

    const colorPicker = document.getElementById('colorPicker');
    colorPicker.innerHTML = '';
    SITE_COLORS.forEach(c => {
      const dot = document.createElement('div');
      dot.className = 'color-dot' + (c === pickedColor ? ' selected' : '');
      dot.style.background = c;
      dot.addEventListener('click', () => {
        pickedColor = c;
        colorPicker.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
      });
      colorPicker.appendChild(dot);
    });

    if (siteId) {
      const site = getSiteById(siteId);
      if (site) {
        document.getElementById('siteNameInput').value = site.name;
        document.getElementById('siteWageInput').value = site.wage;
        pickedColor = site.color;
        colorPicker.querySelectorAll('.color-dot').forEach(d => {
          d.classList.toggle('selected', d.style.background === site.color ||
            d.style.backgroundColor === site.color);
        });
      }
    } else {
      document.getElementById('siteNameInput').value = '';
      document.getElementById('siteWageInput').value = '';
      const used = getSites().map(s => s.color);
      pickedColor = SITE_COLORS.find(c => !used.includes(c)) || SITE_COLORS[0];
      colorPicker.querySelectorAll('.color-dot').forEach(d => {
        d.classList.toggle('selected', d.style.background === pickedColor ||
          d.style.backgroundColor === pickedColor);
      });
    }
    document.getElementById('siteModalOverlay').classList.add('open');
    document.getElementById('siteNameInput').focus();
  }

  function closeSiteModal() {
    document.getElementById('siteModalOverlay').classList.remove('open');
    editingSiteId = null;
  }

  document.getElementById('btnAddSite').addEventListener('click', () => openSiteModal());
  document.getElementById('btnSiteCancel').addEventListener('click', closeSiteModal);
  document.getElementById('siteModalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('siteModalOverlay')) closeSiteModal();
  });

  document.getElementById('btnSiteSave').addEventListener('click', () => {
    const name = document.getElementById('siteNameInput').value.trim();
    const wage = parseInt(document.getElementById('siteWageInput').value) || 0;
    if (!name) { alert('현장 이름을 입력해주세요!'); return; }
    if (!wage)  { alert('일당을 입력해주세요!'); return; }

    const sites = getSites();
    if (editingSiteId) {
      const idx = sites.findIndex(s => s.id === editingSiteId);
      if (idx !== -1) sites[idx] = { ...sites[idx], name, wage, color: pickedColor };
    } else {
      sites.push({ id: 'site_' + Date.now(), name, wage, color: pickedColor });
    }
    saveSites(sites);
    closeSiteModal();
    renderSiteList(); renderCalendar();
  });

  // ── 날짜 데이터 ─────────────────────────────
  function storageKey(d) { return 'daywage_' + d; }
  function loadDay(d)     { const r = localStorage.getItem(storageKey(d)); return r ? JSON.parse(r) : null; }
  function saveDay(d, v)  { localStorage.setItem(storageKey(d), JSON.stringify(v)); }
  function deleteDay(d)   { localStorage.removeItem(storageKey(d)); }

  // ── 공휴일 ─────────────────────────────────
  const HOLIDAYS = {
    '2024-01-01':'신정','2024-02-09':'설 연휴','2024-02-10':'설날','2024-02-11':'설 연휴',
    '2024-02-12':'대체공휴일','2024-03-01':'삼일절','2024-05-05':'어린이날',
    '2024-05-15':'부처님오신날','2024-06-06':'현충일','2024-08-15':'광복절',
    '2024-09-16':'추석 연휴','2024-09-17':'추석','2024-09-18':'추석 연휴',
    '2024-10-03':'개천절','2024-10-09':'한글날','2024-12-25':'성탄절',
    '2025-01-01':'신정','2025-01-28':'설 연휴','2025-01-29':'설날','2025-01-30':'설 연휴',
    '2025-03-01':'삼일절','2025-05-05':'어린이날','2025-05-06':'대체공휴일',
    '2025-06-06':'현충일','2025-08-15':'광복절',
    '2025-10-03':'개천절','2025-10-05':'추석 연휴','2025-10-06':'추석','2025-10-07':'추석 연휴',
    '2025-10-09':'한글날','2025-12-25':'성탄절',
    '2026-01-01':'신정','2026-02-16':'설 연휴','2026-02-17':'설날','2026-02-18':'설 연휴',
    '2026-03-01':'삼일절','2026-05-05':'어린이날','2026-05-24':'부처님오신날',
    '2026-06-06':'현충일','2026-08-15':'광복절',
    '2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴',
    '2026-10-03':'개천절','2026-10-09':'한글날','2026-12-25':'성탄절',
    '2027-01-01':'신정','2027-02-06':'설 연휴','2027-02-07':'설날','2027-02-08':'설 연휴',
    '2027-03-01':'삼일절','2027-05-05':'어린이날','2027-05-13':'부처님오신날',
    '2027-06-06':'현충일','2027-08-15':'광복절',
    '2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴',
    '2027-10-03':'개천절','2027-10-09':'한글날','2027-12-25':'성탄절',
  };

  // ── 캘린더 ─────────────────────────────────
  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    document.getElementById('monthTitle').textContent = `${currentYear}년 ${currentMonth + 1}월`;

    ['일','월','화','수','목','금','토'].forEach(h => {
      const el = document.createElement('div');
      el.className = 'day-header';
      el.textContent = h;
      grid.appendChild(el);
    });

    const firstDay    = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const today       = new Date();

    for (let i = 0; i < firstDay; i++) {
      const e = document.createElement('div'); e.className = 'day-cell empty'; grid.appendChild(e);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayData = loadDay(dateStr);
      const dow      = new Date(currentYear, currentMonth, d).getDay();
      const isHoliday = !!HOLIDAYS[dateStr];
      const isToday   = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;

      const site = dayData?.siteId ? getSiteById(dayData.siteId) : null;

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dow === 0 || isHoliday) cell.classList.add('sunday');
      if (dow === 6) cell.classList.add('saturday');
      if (isToday)   cell.classList.add('today');
      if (dayData)   cell.classList.add('worked');

      // 현장 색상 스트립
      if (site) {
        const strip = document.createElement('div');
        strip.className = 'day-site-strip';
        strip.style.background = site.color;
        cell.appendChild(strip);
      }

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = d;
      cell.appendChild(numEl);

      if (isHoliday) {
        const hl = document.createElement('div');
        hl.className = 'day-holiday';
        hl.textContent = HOLIDAYS[dateStr];
        cell.appendChild(hl);
      }

      if (dayData) {
        const emoji = document.createElement('div');
        emoji.className = 'attend-emoji';
        emoji.textContent = dayData.emoji || '';
        cell.appendChild(emoji);

        if (site) {
          const sl = document.createElement('div');
          sl.className = 'day-site-label';
          sl.style.color = site.color;
          sl.textContent = site.name.length > 4 ? site.name.slice(0, 4) : site.name;
          cell.appendChild(sl);
        }

        if (WORK_EMOJIS.has(dayData.emoji) && dayData.wage) {
          const w = document.createElement('div');
          w.className = 'day-wage';
          w.textContent = `${(dayData.wage / 10000).toLocaleString()}만`;
          cell.appendChild(w);
        }

        const lines = [];
        if (dayData.meal)      lines.push(`🍚${dayData.meal.toLocaleString()}`);
        if (dayData.transport) lines.push(`🚌${dayData.transport.toLocaleString()}`);
        if (lines.length) {
          const exp = document.createElement('div');
          exp.className = 'day-expense';
          exp.textContent = lines.join(' ');
          cell.appendChild(exp);
        }
      }

      cell.addEventListener('click', () => openModal(dateStr, d));
      grid.appendChild(cell);
    }

    updateSummary();
    updateYearStats();
  }

  // ── 날짜 모달 ─────────────────────────────
  function renderSitePicker(selectedId) {
    const sites  = getSites();
    const picker = document.getElementById('sitePicker');
    picker.innerHTML = '';
    if (!sites.length) {
      picker.innerHTML = '<div class="no-site-msg">위에서 현장을 먼저 추가해주세요</div>';
      return;
    }
    sites.forEach(site => {
      const btn = document.createElement('button');
      btn.className = 'site-pick-btn' + (site.id === selectedId ? ' selected' : '');
      if (site.id === selectedId) btn.style.background = site.color;
      btn.innerHTML = `<span class="sp-dot" style="background:${site.color}"></span>${site.name}`;
      btn.addEventListener('click', () => {
        selectedSiteId = site.id;
        document.querySelectorAll('.site-pick-btn').forEach(b => {
          b.classList.remove('selected');
          b.style.background = '';
        });
        btn.classList.add('selected');
        btn.style.background = site.color;
        updateWagePreview();
      });
      picker.appendChild(btn);
    });
  }

  function updateWagePreview() {
    const preview = document.getElementById('modalWagePreview');
    const site = selectedSiteId ? getSiteById(selectedSiteId) : null;
    if (site) {
      preview.textContent = `💼 ${site.name} 일당: ${site.wage.toLocaleString()}원`;
      preview.style.display = 'block';
      preview.style.color = site.color;
      preview.style.background = site.color + '18';
    } else {
      preview.style.display = 'none';
    }
  }

  function openModal(dateStr, day) {
    selectedDate  = dateStr;
    selectedEmoji = null;
    const existing = loadDay(dateStr);
    selectedSiteId = existing?.siteId || null;

    document.getElementById('modalTitle').textContent = `${currentYear}년 ${currentMonth+1}월 ${day}일`;
    document.getElementById('modalMeal').value      = existing?.meal      || '';
    document.getElementById('modalTransport').value = existing?.transport || '';

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.classList.remove('selected');
      if (existing && btn.dataset.emoji === existing.emoji) {
        btn.classList.add('selected');
        selectedEmoji = existing.emoji;
      }
    });

    renderSitePicker(selectedSiteId);
    updateWagePreview();
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    selectedDate = null; selectedEmoji = null;
  }

  document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedEmoji = btn.dataset.emoji;
    });
  });

  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  document.getElementById('btnSave').addEventListener('click', () => {
    if (!selectedDate)  return;
    if (!selectedEmoji) { alert('상태를 선택해 주세요!'); return; }
    if (WORK_EMOJIS.has(selectedEmoji) && !selectedSiteId) {
      alert('현장을 선택해 주세요!'); return;
    }

    const site      = selectedSiteId ? getSiteById(selectedSiteId) : null;
    const wage      = WORK_EMOJIS.has(selectedEmoji) ? (site?.wage || 0) : 0;
    const meal      = parseInt(document.getElementById('modalMeal').value)      || 0;
    const transport = parseInt(document.getElementById('modalTransport').value) || 0;

    saveDay(selectedDate, { emoji: selectedEmoji, siteId: selectedSiteId, wage, meal, transport });
    closeModal(); renderCalendar();
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    if (!selectedDate) return;
    deleteDay(selectedDate); closeModal(); renderCalendar();
  });

  // ── 요약 ────────────────────────────────────
  function getMonthNet(year, month) {
    const days = new Date(year, month + 1, 0).getDate();
    let workDays = 0, income = 0, meal = 0, transport = 0;
    const siteMap = {};
    for (let d = 1; d <= days; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const data = loadDay(dateStr);
      if (!data || !WORK_EMOJIS.has(data.emoji)) continue;
      workDays++;
      income    += data.wage      || 0;
      meal      += data.meal      || 0;
      transport += data.transport || 0;
      const sid = data.siteId || 'none';
      if (!siteMap[sid]) siteMap[sid] = { days: 0, income: 0 };
      siteMap[sid].days++;
      siteMap[sid].income += data.wage || 0;
    }
    return { workDays, income, meal, transport, net: income + meal + transport, siteMap };
  }

  function updateSummary() {
    const { workDays, income, meal, transport, net, siteMap } = getMonthNet(currentYear, currentMonth);
    document.getElementById('sumDays').textContent      = `${workDays}일`;
    document.getElementById('sumIncome').textContent    = `${income.toLocaleString()}원`;
    document.getElementById('sumMeal').textContent      = `${meal.toLocaleString()}원`;
    document.getElementById('sumTransport').textContent = `${transport.toLocaleString()}원`;
    document.getElementById('sumNet').textContent       = `${net.toLocaleString()}원`;

    // 현장별 요약
    const listEl = document.getElementById('siteSummaryList');
    const sites  = getSites();
    const entries = Object.entries(siteMap).filter(([, v]) => v.days > 0);
    if (!entries.length) { listEl.innerHTML = ''; return; }

    listEl.innerHTML = '<div style="font-size:0.75rem;font-weight:600;color:var(--text-sub);margin-bottom:6px;">현장별 내역</div>';
    entries.forEach(([sid, v]) => {
      const site = sites.find(s => s.id === sid);
      const name  = site ? site.name : '미분류';
      const color = site ? site.color : '#9ca3af';
      const el = document.createElement('div');
      el.className = 'site-summary-item';
      el.style.borderLeftColor = color;
      el.innerHTML = `
        <div class="site-summary-info">
          <div class="site-summary-name" style="color:${color}">${name}</div>
          <div class="site-summary-detail">${v.days}일 출근</div>
        </div>
        <div class="site-summary-amount" style="color:${color}">${v.income.toLocaleString()}원</div>`;
      listEl.appendChild(el);
    });
  }

  function updateYearStats() {
    document.getElementById('yearTitle').textContent = `${currentYear}년`;
    const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    const monthData = MONTHS.map((_, i) => ({ ...getMonthNet(currentYear, i), label: MONTHS[i], idx: i }));

    const maxNet   = Math.max(...monthData.map(m => m.net), 1);
    const yearDays = monthData.reduce((acc, m) => acc + m.workDays, 0);
    const yearNet  = monthData.reduce((acc, m) => acc + m.net, 0);

    document.getElementById('yearDays').textContent = `${yearDays}일`;
    document.getElementById('yearNet').textContent  = `${yearNet.toLocaleString()}원`;

    const container = document.getElementById('monthBars');
    container.innerHTML = '';
    monthData.forEach(m => {
      const row = document.createElement('div');
      row.className = 'month-row' + (m.idx === currentMonth ? ' current-month' : '');
      const label = document.createElement('div');
      label.className = 'month-label';
      label.textContent = m.label;
      const track = document.createElement('div');
      track.className = 'bar-track';
      const fill = document.createElement('div');
      fill.className = 'bar-fill' + (m.net === 0 ? ' empty' : '');
      fill.style.width = m.net === 0 ? '4px' : `${(m.net / maxNet) * 100}%`;
      track.appendChild(fill);
      const amount = document.createElement('div');
      amount.className = 'month-amount' + (m.net === 0 ? ' zero' : '');
      amount.textContent = m.net === 0 ? '-' : `${(m.net / 10000).toFixed(0)}만원`;
      row.appendChild(label); row.appendChild(track); row.appendChild(amount);
      container.appendChild(row);
    });
  }

  // ── 네비게이션 ──────────────────────────────
  document.getElementById('prevMonth').addEventListener('click', () => {
    currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar();
  });

  // ── 초기화 ──────────────────────────────────
  document.getElementById('btnResetMonth').addEventListener('click', () => {
    if (!confirm(`${currentYear}년 ${currentMonth+1}월 데이터를 모두 삭제할까요?`)) return;
    const days = new Date(currentYear, currentMonth + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      deleteDay(`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    }
    renderCalendar();
  });

  // ── 백업/복원 ────────────────────────────────
  document.getElementById('btnExport').addEventListener('click', () => {
    const data = { sites: getSites() };
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('daywage_')) data[k] = JSON.parse(localStorage.getItem(k));
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `일당기록_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  });

  document.getElementById('fileImport').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.sites) saveSites(data.sites);
        Object.entries(data).forEach(([k, v]) => {
          if (k.startsWith('daywage_')) localStorage.setItem(k, JSON.stringify(v));
        });
        const msg = document.getElementById('importMsg');
        msg.textContent = `✅ 복원 완료!`;
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
        renderSiteList(); renderCalendar();
      } catch { alert('파일을 읽을 수 없어요.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ── 초기 렌더 ────────────────────────────────
  renderSiteList();
  renderCalendar();
</script>
</body>
</html>
