<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일당 계산기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 20px 24px;
      text-align: center;
    }
    header h1 { font-size: 1.6rem; margin-bottom: 4px; }
    header p { font-size: 0.9rem; opacity: 0.85; }

    .container { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

    /* 일당 설정 카드 */
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .card h2 { font-size: 1rem; color: #555; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

    .radio-group {
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .radio-group label {
      display: flex; align-items: center; gap: 6px;
      background: #f5f5f5; border: 2px solid #e0e0e0;
      border-radius: 10px; padding: 8px 16px;
      cursor: pointer; font-size: 0.95rem; transition: all 0.2s;
    }
    .radio-group input[type="radio"] { display: none; }
    .radio-group input[type="radio"]:checked + span {
      font-weight: bold;
    }
    .radio-group label:has(input:checked) {
      background: #667eea; border-color: #667eea; color: white;
    }

    .custom-wage {
      display: flex; align-items: center; gap: 8px; margin-top: 12px;
    }
    .custom-wage input {
      border: 2px solid #e0e0e0; border-radius: 10px;
      padding: 8px 12px; font-size: 0.95rem; width: 160px;
      outline: none; transition: border-color 0.2s;
    }
    .custom-wage input:focus { border-color: #667eea; }
    .custom-wage span { color: #555; font-size: 0.9rem; }

    /* 비용 설정 */
    .expense-row {
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .expense-item {
      flex: 1; min-width: 180px;
    }
    .expense-item label { font-size: 0.85rem; color: #777; display: block; margin-bottom: 6px; }
    .expense-item input {
      width: 100%; border: 2px solid #e0e0e0; border-radius: 10px;
      padding: 8px 12px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .expense-item input:focus { border-color: #667eea; }

    /* 월 네비게이션 */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .month-nav button {
      background: #667eea; color: white; border: none;
      border-radius: 8px; padding: 6px 14px; cursor: pointer;
      font-size: 1rem; transition: background 0.2s;
    }
    .month-nav button:hover { background: #5a6fd6; }
    .month-nav h2 { font-size: 1.2rem; color: #444; }

    /* 캘린더 */
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day-header {
      text-align: center; font-size: 0.8rem; font-weight: 600;
      padding: 6px 0; color: #888;
    }
    .day-header:first-child { color: #e74c3c; }
    .day-header:last-child { color: #3498db; }

    .day-cell {
      background: #fafafa; border: 2px solid #eee;
      border-radius: 12px; padding: 8px 4px;
      text-align: center; cursor: pointer;
      transition: all 0.15s; min-height: 72px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      position: relative;
    }
    .day-cell:hover:not(.empty) { border-color: #667eea; background: #f0f0ff; }
    .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }
    .day-cell.today { border-color: #667eea; background: #f0f0ff; }
    .day-cell.sunday .day-num { color: #e74c3c; }
    .day-cell.saturday .day-num { color: #3498db; }

    .day-num { font-size: 0.85rem; font-weight: 600; color: #444; }

    .attend-emoji { font-size: 1.4rem; line-height: 1; }

    .day-wage {
      font-size: 0.68rem; font-weight: 700; color: #3355cc; line-height: 1.2;
    }

    .day-expense {
      font-size: 0.6rem; color: #999; line-height: 1.3;
    }

    .day-cell.worked { background: #eef5ff; border-color: #a0bdf8; }
    .day-cell.worked .day-num { color: #3355cc; }

    /* 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 20px; padding: 28px 24px;
      width: 320px; max-width: 95vw; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .modal h3 { font-size: 1.1rem; margin-bottom: 18px; color: #444; }

    .emoji-btn-row {
      display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap;
    }
    .emoji-btn {
      font-size: 2rem; background: #f5f5f5; border: 2px solid #e0e0e0;
      border-radius: 12px; padding: 8px 12px; cursor: pointer; transition: all 0.15s;
    }
    .emoji-btn:hover { border-color: #667eea; background: #f0f0ff; }
    .emoji-btn.selected { border-color: #667eea; background: #e8eeff; }

    .modal-expense-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .modal-expense-row label { font-size: 0.85rem; color: #777; }
    .modal-expense-row input {
      border: 2px solid #e0e0e0; border-radius: 10px;
      padding: 8px 12px; font-size: 0.95rem; outline: none;
    }
    .modal-expense-row input:focus { border-color: #667eea; }

    .modal-btns { display: flex; gap: 10px; }
    .btn-cancel {
      flex: 1; padding: 10px; border: 2px solid #e0e0e0;
      border-radius: 10px; background: white; cursor: pointer;
      font-size: 0.95rem; color: #777; transition: all 0.15s;
    }
    .btn-cancel:hover { border-color: #aaa; }
    .btn-save {
      flex: 2; padding: 10px; border: none;
      border-radius: 10px; background: #667eea; color: white;
      cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: all 0.15s;
    }
    .btn-save:hover { background: #5a6fd6; }
    .btn-clear {
      flex: 1; padding: 10px; border: 2px solid #fca5a5;
      border-radius: 10px; background: white; cursor: pointer;
      font-size: 0.95rem; color: #e74c3c; transition: all 0.15s;
    }
    .btn-clear:hover { background: #fff0f0; }

    /* 요약 */
    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .summary-item {
      background: #f8f9ff; border-radius: 12px; padding: 14px 16px;
      text-align: center; border: 2px solid #e8eaff;
    }
    .summary-item .s-label { font-size: 0.78rem; color: #888; margin-bottom: 6px; }
    .summary-item .s-value { font-size: 1.2rem; font-weight: 700; color: #444; }
    .summary-item.highlight .s-value { color: #667eea; }
    .summary-item.negative .s-value { color: #e74c3c; }
    .summary-item.net .s-value { color: #27ae60; font-size: 1.35rem; }

    .btn-reset {
      padding: 6px 14px; border-radius: 8px; font-size: 0.82rem;
      cursor: pointer; border: 2px solid #fca5a5;
      background: white; color: #e74c3c; transition: all 0.15s;
    }
    .btn-reset:hover { background: #fff0f0; }
    .btn-reset.danger { border-color: #ef4444; background: #fef2f2; }
    .btn-reset.danger:hover { background: #fee2e2; }
  </style>
</head>
<body>

<header>
  <h1>💰 일당 계산기</h1>
  <p>출근 기록과 수입/지출을 한눈에 관리하세요</p>
</header>

<div class="container">

  <!-- 일당 설정 -->
  <div class="card">
    <h2>💼 일당 설정</h2>
    <div class="radio-group" id="wageRadios">
      <label><input type="radio" name="wage" value="150000"><span>15만원</span></label>
      <label><input type="radio" name="wage" value="160000"><span>16만원</span></label>
      <label><input type="radio" name="wage" value="170000"><span>17만원</span></label>
      <label><input type="radio" name="wage" value="180000"><span>18만원</span></label>
      <label><input type="radio" name="wage" value="190000"><span>19만원</span></label>
      <label><input type="radio" name="wage" value="200000"><span>20만원</span></label>
      <label><input type="radio" name="wage" value="custom" id="radioCustom"><span>직접 입력</span></label>
    </div>
    <div class="custom-wage" id="customWageArea" style="display:none;">
      <input type="number" id="customWageInput" placeholder="금액 입력" min="0" step="1000" />
      <span>원</span>
    </div>
  </div>

  <!-- 캘린더 -->
  <div class="card">
    <div class="month-nav">
      <button id="prevMonth">&#8592;</button>
      <h2 id="monthTitle"></h2>
      <button id="nextMonth">&#8594;</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- 월별 요약 -->
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
      <h2 style="margin:0;">📊 이번 달 요약</h2>
      <div style="display:flex; gap:8px;">
        <button id="btnResetMonth" class="btn-reset">🗑️ 이번 달 초기화</button>
        <button id="btnResetAll"   class="btn-reset danger">⚠️ 전체 초기화</button>
      </div>
    </div>
    <div class="summary-grid">
      <div class="summary-item highlight">
        <div class="s-label">출근 일수</div>
        <div class="s-value" id="sumDays">0일</div>
      </div>
      <div class="summary-item highlight">
        <div class="s-label">총 수입</div>
        <div class="s-value" id="sumIncome">0원</div>
      </div>
      <div class="summary-item highlight">
        <div class="s-label">밥값 청구 합계</div>
        <div class="s-value" id="sumMeal">0원</div>
      </div>
      <div class="summary-item highlight">
        <div class="s-label">차비 청구 합계</div>
        <div class="s-value" id="sumTransport">0원</div>
      </div>
      <div class="summary-item net">
        <div class="s-label">총 수령액 (일당 + 밥값 + 차비)</div>
        <div class="s-value" id="sumNet">0원</div>
      </div>
    </div>
  </div>

</div>

<!-- 날짜 클릭 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">날짜 기록</h3>
    <div class="emoji-btn-row">
      <button class="emoji-btn" data-emoji="✅" title="출근">✅</button>
      <button class="emoji-btn" data-emoji="🏖️" title="휴일">🏖️</button>
      <button class="emoji-btn" data-emoji="🤒" title="병결">🤒</button>
      <button class="emoji-btn" data-emoji="⭐" title="특근">⭐</button>
      <button class="emoji-btn" data-emoji="❌" title="결근">❌</button>
    </div>
    <div class="modal-expense-row">
      <label>🍚 밥값 청구 (원)</label>
      <input type="number" id="modalMeal" placeholder="오늘 밥값 청구액" min="0" step="500" />
      <label>🚌 차비 청구 (원)</label>
      <input type="number" id="modalTransport" placeholder="오늘 차비 청구액" min="0" step="500" />
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="btnCancel">취소</button>
      <button class="btn-clear" id="btnClear">삭제</button>
      <button class="btn-save" id="btnSave">저장</button>
    </div>
  </div>
</div>

<script>
  // ── 상태 ──────────────────────────────────────────────
  let currentYear  = new Date().getFullYear();
  let currentMonth = new Date().getMonth(); // 0-based
  let selectedDate = null; // "YYYY-MM-DD"
  let selectedEmoji = null;

  const WORK_EMOJIS = new Set(['✅', '⭐']); // 수입이 생기는 이모지

  function getWage() {
    const checked = document.querySelector('input[name="wage"]:checked');
    if (!checked) return 0;
    if (checked.value === 'custom') {
      return parseInt(document.getElementById('customWageInput').value) || 0;
    }
    return parseInt(checked.value);
  }

  // ── localStorage 헬퍼 ────────────────────────────────
  function storageKey(dateStr) { return 'daywage_' + dateStr; }

  function loadDay(dateStr) {
    const raw = localStorage.getItem(storageKey(dateStr));
    return raw ? JSON.parse(raw) : null;
  }

  function saveDay(dateStr, data) {
    localStorage.setItem(storageKey(dateStr), JSON.stringify(data));
  }

  function deleteDay(dateStr) {
    localStorage.removeItem(storageKey(dateStr));
  }

  // ── 캘린더 렌더링 ─────────────────────────────────────
  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    document.getElementById('monthTitle').textContent =
      `${currentYear}년 ${currentMonth + 1}월`;

    const headers = ['일','월','화','수','목','금','토'];
    headers.forEach(h => {
      const d = document.createElement('div');
      d.className = 'day-header';
      d.textContent = h;
      grid.appendChild(d);
    });

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const today = new Date();

    for (let i = 0; i < firstDay; i++) {
      const e = document.createElement('div');
      e.className = 'day-cell empty';
      grid.appendChild(e);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayData = loadDay(dateStr);
      const dow = new Date(currentYear, currentMonth, d).getDay();

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dow === 0) cell.classList.add('sunday');
      if (dow === 6) cell.classList.add('saturday');
      if (today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d)
        cell.classList.add('today');
      if (dayData) cell.classList.add('worked');

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = d;
      cell.appendChild(numEl);

      if (dayData) {
        const emojiEl = document.createElement('div');
        emojiEl.className = 'attend-emoji';
        emojiEl.textContent = dayData.emoji || '';
        cell.appendChild(emojiEl);

        if (WORK_EMOJIS.has(dayData.emoji) && dayData.wage) {
          const wageEl = document.createElement('div');
          wageEl.className = 'day-wage';
          wageEl.textContent = `💰${(dayData.wage / 10000).toLocaleString()}만`;
          cell.appendChild(wageEl);
        }

        const expEl = document.createElement('div');
        expEl.className = 'day-expense';
        const lines = [];
        if (dayData.meal)      lines.push(`🍚${dayData.meal.toLocaleString()}`);
        if (dayData.transport) lines.push(`🚌${dayData.transport.toLocaleString()}`);
        expEl.textContent = lines.join(' ');
        cell.appendChild(expEl);
      }

      cell.addEventListener('click', () => openModal(dateStr, d));
      grid.appendChild(cell);
    }

    updateSummary();
  }

  // ── 요약 업데이트 ─────────────────────────────────────
  function updateSummary() {
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    let days = 0, income = 0, meal = 0, transport = 0;

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const data = loadDay(dateStr);
      if (!data) continue;
      if (WORK_EMOJIS.has(data.emoji)) {
        days++;
        income += data.wage || 0;
      }
      meal      += data.meal      || 0;
      transport += data.transport || 0;
    }

    document.getElementById('sumDays').textContent      = `${days}일`;
    document.getElementById('sumIncome').textContent    = `${income.toLocaleString()}원`;
    document.getElementById('sumMeal').textContent      = `${meal.toLocaleString()}원`;
    document.getElementById('sumTransport').textContent = `${transport.toLocaleString()}원`;
    const net = income + meal + transport;
    document.getElementById('sumNet').textContent       = `${net.toLocaleString()}원`;
  }

  // ── 모달 ──────────────────────────────────────────────
  function openModal(dateStr, day) {
    selectedDate  = dateStr;
    selectedEmoji = null;

    document.getElementById('modalTitle').textContent =
      `${currentYear}년 ${currentMonth+1}월 ${day}일`;

    const existing = loadDay(dateStr);
    document.getElementById('modalMeal').value      = existing ? (existing.meal      || '') : '';
    document.getElementById('modalTransport').value = existing ? (existing.transport || '') : '';

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.classList.remove('selected');
      if (existing && btn.dataset.emoji === existing.emoji) {
        btn.classList.add('selected');
        selectedEmoji = existing.emoji;
      }
    });

    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    selectedDate = null;
    selectedEmoji = null;
  }

  document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedEmoji = btn.dataset.emoji;
    });
  });

  document.getElementById('btnCancel').addEventListener('click', closeModal);

  document.getElementById('btnSave').addEventListener('click', () => {
    if (!selectedDate) return;
    if (!selectedEmoji) {
      alert('이모지를 선택해 주세요!');
      return;
    }
    const meal      = parseInt(document.getElementById('modalMeal').value)      || 0;
    const transport = parseInt(document.getElementById('modalTransport').value) || 0;
    const wage = WORK_EMOJIS.has(selectedEmoji) ? getWage() : 0;

    saveDay(selectedDate, { emoji: selectedEmoji, meal, transport, wage });
    closeModal();
    renderCalendar();
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    if (!selectedDate) return;
    deleteDay(selectedDate);
    closeModal();
    renderCalendar();
  });

  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  // ── 월 이동 ───────────────────────────────────────────
  document.getElementById('prevMonth').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  });

  // ── 일당 라디오 직접입력 토글 ─────────────────────────
  document.querySelectorAll('input[name="wage"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.getElementById('customWageArea').style.display =
        radio.value === 'custom' ? 'flex' : 'none';
    });
  });

  // ── 초기화 ───────────────────────────────────────────
  document.getElementById('btnResetMonth').addEventListener('click', () => {
    if (!confirm(`${currentYear}년 ${currentMonth+1}월 데이터를 모두 삭제할까요?`)) return;
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      deleteDay(dateStr);
    }
    renderCalendar();
  });

  document.getElementById('btnResetAll').addEventListener('click', () => {
    if (!confirm('전체 기록을 모두 삭제할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
    const keysToDelete = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('daywage_')) keysToDelete.push(key);
    }
    keysToDelete.forEach(k => localStorage.removeItem(k));
    renderCalendar();
  });

  // ── 초기 렌더 ─────────────────────────────────────────
  renderCalendar();
</script>
</body>
</html>
